<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>B-17 Bomber</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <a class="hub-link" href="../">&larr; Games</a>
    <h1>B-17 Bomber</h1>
    <div id="scores">
      <div class="score-pill"><span class="team-label">Score</span><span id="score">0</span></div>
      <div class="score-pill"><span class="team-label">Best</span><span id="best">0</span></div>
      <div class="score-pill"><span class="team-label">HP</span><span id="hp">100</span></div>
      <div class="score-pill"><span class="team-label">Bombs</span><span id="bombs">16</span></div>
    </div>
    <button id="new-game-btn">Restart</button>
  </header>

  <div id="table">
    <div id="board-wrap">
      <canvas id="canvas"></canvas>
      <div id="overlay"></div>
      <div id="viewLabel">BOMBARDIER</div>
    </div>

    <div id="controls">
      <div class="ctl-col">
        <button class="ctl-btn" id="btn-alt-up" title="Climb">&#9650;ALT</button>
        <div class="ctl-row">
          <button class="ctl-btn" id="btn-aim-left">&larr;</button>
          <button class="ctl-btn" id="btn-aim-right">&rarr;</button>
        </div>
        <button class="ctl-btn" id="btn-alt-down" title="Dive">&#9660;ALT</button>
      </div>
      <div class="ctl-col ctl-center">
        <button class="ctl-btn" id="btn-view">Switch View</button>
        <button class="ctl-btn ctl-action" id="btn-action">Drop Bomb</button>
      </div>
      <div class="ctl-col">
        <button class="ctl-btn" id="btn-throttle-up" title="Throttle up">THR&#9650;</button>
        <button class="ctl-btn" id="btn-throttle-down" title="Throttle down">THR&#9660;</button>
      </div>
    </div>
    <p id="hint">Bombardier: aim + drop bombs, lead your target. Gunner: aim + fire on incoming fighters.</p>
  </div>
</div>

<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
