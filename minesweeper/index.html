<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Minesweeper</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💣</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <a class="hub-link" href="../">&larr; Games</a>
    <h1>Minesweeper</h1>
    <div id="scores">
      <div class="score-pill"><span class="team-label">Mines</span><span id="mines-left">10</span></div>
      <div class="score-pill"><span class="team-label">Time</span><span id="timer">0</span></div>
    </div>
    <div id="difficulty">
      <button class="diff-btn" data-diff="beginner">Beginner</button>
      <button class="diff-btn" data-diff="intermediate">Intermediate</button>
      <button class="diff-btn" data-diff="expert">Expert</button>
    </div>
    <button id="new-game-btn">Restart</button>
  </header>

  <div id="table">
    <div id="grid"></div>
  </div>

  <div id="controls">
    <label class="flag-toggle"><input type="checkbox" id="flag-mode"> Flag mode (for touch)</label>
    <div id="status-msg" class="control-msg"></div>
  </div>
</div>

<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
