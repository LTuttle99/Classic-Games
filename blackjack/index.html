<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Blackjack</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🂱</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <a class="hub-link" href="../">&larr; Games</a>
    <h1>Blackjack</h1>
    <div class="score-pill"><span class="team-label">Bankroll</span><span id="balance">1000</span></div>
    <div class="score-pill"><span class="team-label">Bet</span><span id="bet">0</span></div>
    <button id="new-game-btn">Reset Bankroll</button>
  </header>

  <div id="table">
    <div class="hand-area">
      <div class="hand-label">Dealer <span id="dealer-total"></span></div>
      <div class="hand" id="dealer-hand"></div>
    </div>

    <div class="hand-area">
      <div class="hand-label">You <span id="player-total"></span></div>
      <div class="hand" id="player-hand"></div>
    </div>
  </div>

  <div id="controls"></div>
  <div id="log"></div>
</div>

<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
