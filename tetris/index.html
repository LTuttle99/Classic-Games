<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tetris</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧱</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <a class="hub-link" href="../">&larr; Games</a>
    <h1>Tetris</h1>
    <div id="scores">
      <div class="score-pill"><span class="team-label">Score</span><span id="score">0</span></div>
      <div class="score-pill"><span class="team-label">Best</span><span id="best">0</span></div>
      <div class="score-pill"><span class="team-label">Level</span><span id="level">1</span></div>
    </div>
    <button id="new-game-btn">Restart</button>
  </header>

  <div id="table">
    <div id="play-area">
      <div id="board-wrap">
        <canvas id="canvas"></canvas>
        <div id="overlay"></div>
      </div>
      <div id="side-panel">
        <div class="panel-label">Next</div>
        <canvas id="next-canvas"></canvas>
      </div>
    </div>

    <div id="touch-controls">
      <button class="ctl-btn" id="btn-left">&larr;</button>
      <button class="ctl-btn" id="btn-rotate">&#8635;</button>
      <button class="ctl-btn" id="btn-right">&rarr;</button>
      <button class="ctl-btn" id="btn-down">&darr;</button>
      <button class="ctl-btn" id="btn-drop">Drop</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
