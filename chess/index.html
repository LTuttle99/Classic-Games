<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Chess</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♞</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <a class="hub-link" href="../">&larr; Games</a>
    <h1>Chess</h1>
    <div id="scores">
      <div class="score-pill"><span class="team-label">Captured</span><span id="cap-white">&mdash;</span></div>
      <div class="score-pill"><span class="team-label">Captured</span><span id="cap-black">&mdash;</span></div>
    </div>
    <button id="new-game-btn">New Game</button>
  </header>

  <div id="table">
    <div id="board-wrap">
      <div id="board"></div>
      <div id="promo-overlay"></div>
    </div>
  </div>

  <div id="controls"></div>
  <div id="log"></div>
</div>

<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
