<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pong</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏓</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <a class="hub-link" href="../">&larr; Games</a>
    <h1>Pong</h1>
    <div id="scores">
      <div class="score-pill"><span class="team-label">You</span><span id="score-player">0</span></div>
      <div class="score-pill"><span class="team-label">CPU</span><span id="score-ai">0</span></div>
    </div>
    <button id="new-game-btn">Restart</button>
  </header>

  <div id="table">
    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div id="overlay"></div>
    </div>
    <div id="hint">Move your mouse (or touch-drag, or Arrow/W-S keys) to control your paddle.</div>
  </div>
</div>

<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
