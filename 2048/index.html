<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>2048</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔢</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <a class="hub-link" href="../">&larr; Games</a>
    <h1>2048</h1>
    <div id="scores">
      <div class="score-pill"><span class="team-label">Score</span><span id="score">0</span></div>
      <div class="score-pill"><span class="team-label">Best</span><span id="best">0</span></div>
    </div>
    <button id="new-game-btn">New Game</button>
  </header>

  <div id="table">
    <div id="board-wrap">
      <div id="grid-bg"></div>
      <div id="tiles"></div>
      <div id="overlay"></div>
    </div>
    <div id="hint">Use arrow keys or swipe to move tiles. Merge matching numbers to reach 2048.</div>
  </div>
</div>

<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
