<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tic-Tac-Toe</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭕</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <a class="hub-link" href="../">&larr; Games</a>
    <h1>Tic-Tac-Toe</h1>
    <div id="scores">
      <div class="score-pill"><span class="team-label">You (X)</span><span id="score-x">0</span></div>
      <div class="score-pill"><span class="team-label">Draws</span><span id="score-draw">0</span></div>
      <div class="score-pill"><span class="team-label">CPU (O)</span><span id="score-o">0</span></div>
    </div>
    <button id="new-game-btn">Reset Scores</button>
  </header>

  <div id="table">
    <div id="board"></div>
  </div>

  <div id="controls"></div>
</div>

<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
